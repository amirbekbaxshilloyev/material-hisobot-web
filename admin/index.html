<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #EFEFF4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #FFFFFF));
    --text: var(--tg-theme-text-color, #1C1C1E);
    --hint: var(--tg-theme-hint-color, #8E8E93);
    --head: var(--tg-theme-section-header-text-color, #2B6CD8);
    --accent: var(--tg-theme-button-color, #2B6CD8);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --danger: var(--tg-theme-destructive-text-color, #E5484D);
    --ok: #2E9E5B;
    --warn: #D9822B;
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  }

  html, body { margin: 0; background: var(--bg); color: var(--text); }

  main { max-width: 680px; margin: 0 auto; padding: 12px 12px 120px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  header.top { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, #3B8BFF, #1D5FD6 55%, #0D3A8C); }
  header.top h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  header.top p { margin: 3px 0 0; font-size: 12.5px; opacity: .85; }
  header.top .crown { font-size: 30px; line-height: 1; }
  nav.tabs { position: sticky; top: 0; z-index: 4; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 10px -12px 12px; padding: 8px 12px; background: var(--bg); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--hint); font-size: 12.5px; }
  .kpi.alert b { color: var(--danger); }
  .rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rows > div:first-child { border-top: 0; padding-top: 2px; }
  .rows span { color: var(--hint); }
  .rows b { font-weight: 600; text-align: right; }
  .list > .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .list > .item:first-child { border-top: 0; }
  .ava { flex: 0 0 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .grow { flex: 1; min-width: 0; }
  .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t2 { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--hint); }

  .badge.red { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .badge.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .badge.gray { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--hint); }
  .firm h3 { margin: 0; font-size: 16px; }
  .firm .meta { color: var(--hint); font-size: 12.5px; margin: 2px 0 8px; }
  .firm .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .firm .stats div { background: var(--bg); border-radius: 10px; padding: 6px 8px; }
  .firm .stats b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  .firm .stats span { font-size: 11.5px; color: var(--hint); }
  .firm .err { color: var(--danger); font-size: 13px; margin: 4px 0; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 9px 12px; background: var(--soft); color: var(--head); font-weight: 600; cursor: pointer; flex: 1 1 auto; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.danger { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .btn.queued { outline: 2px solid var(--accent); }
  .btn:disabled { opacity: .45; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; margin: 4px 0 10px; }
  .seg button { flex: 1; border: 0; border-radius: 8px; padding: 7px 6px; background: transparent; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chips button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: transparent; cursor: pointer; font-size: 13.5px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  label.sw { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
  label.sw:first-of-type { border-top: 0; }
  label.sw .grow small { display: block; color: var(--hint); font-size: 12.5px; }
  .tg-switch { position: relative; flex: 0 0 44px; height: 26px; }
  .tg-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .tg-switch i { position: absolute; inset: 0; border-radius: 999px; background: color-mix(in srgb, var(--hint) 40%, transparent); transition: .15s; }
  .tg-switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .tg-switch input:checked + i { background: var(--accent); }
  .tg-switch input:checked + i::after { left: 21px; }
  .lbl { font-size: 13px; color: var(--hint); margin: 6px 0 2px; }
  input[type=text], input[type=search], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 96px; resize: vertical; }
  .count { text-align: right; font-size: 12px; color: var(--hint); }
  .empty { text-align: center; color: var(--hint); padding: 18px 8px; }
  .hint { color: var(--hint); font-size: 13px; margin: 4px 2px 10px; }
  .search { margin-bottom: 10px; }
  /* O'zgarishlar navbati */
  .queue { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(0,0,0,.08); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: none; }
  .queue.show { display: block; }
  .queue .head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .queue .head b { flex: 1; }
  .queue ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 38vh; overflow: auto; }
  .queue li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .queue li span { flex: 1; }
  .queue li button { border: 0; background: transparent; color: var(--danger); font-size: 16px; cursor: pointer; }
  .queue .save { display: none; margin-top: 8px; width: 100%; }
  .queue.web .save { display: block; }
  /* Pastdan chiqadigan oyna */
  .sheet-bg { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.35); display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 88vh; overflow: auto; background: var(--bg);
    border-radius: 18px 18px 0 0; padding: 8px 12px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .2s, visibility 0s .2s; visibility: hidden; }
  .sheet.open { transform: none; visibility: visible; transition: transform .2s; }
  .sheet-bg.open { display: block; }
  .sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 10px; }
  .sheet h3 { margin: 0 4px 10px; font-size: 18px; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 20; background: rgba(20,20,20,.88); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; max-width: 90vw; text-align: center; }
  .warnbox { background: color-mix(in srgb, var(--warn) 14%, var(--card)); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
  .issue { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .issue:first-child { border-top: 0; }
  .issue .grow div { font-size: 13.5px; }
</style>
</head>

<script>
(function () {
  'use strict';
  var S = {"v":1,"roles":{"owner":"👑 Super admin","user":"👤 Buxgalter","client":"🏢 Firma egasi"},"sections":{"ombor":"🏭 Ombor","tovar":"📦 Tovar kartochkasi","minus":"❓ Minus va 🧮 kalkulyatsiya","hujjat":"🧾 Hujjatlar","audit":"🩺 Audit","sozlama":"⚙️ Sozlamalar"},"toggles":{"search":["Tovar qidirish","ombor"],"tekshir":["Minusni tekshirish","ombor"],"manfiyxls":["Manfiy","ombor"],"hammaxls":["Hamma tovar (Excel)","ombor"],"qoldiq":["Qoldiq kiritish","ombor"],"kalk":["Kalkulyatsiya / akt","ombor"],"kassa":["Kassa savdosi","ombor"],"tarixin":["Qayerdan kelgan","tovar"],"tarixout":["Qayerga ketgan","tovar"],"tarixall":["Tovar tarixi","tovar"],"loadold":["Eski yil hujjatlarini yuklash","tovar"],"fixall":["Hammasini to‘g‘rilash","minus"],"negxls":["Tekshirilmaganlar (Excel)","minus"],"kalkxls":["Kalkulyatsiya fayli (Excel)","minus"],"aktxls":["Akt spisaniya (Excel)","minus"],"shartnoma":["Shartnomalar","hujjat"],"filtr":["Kontragent, tur, davr","hujjat"],"docpdf":["Hujjat PDF","hujjat"],"docxls":["Hujjat Excel","hujjat"],"alerts":["Xatolar","audit"],"events":["Oxirgi amallar","audit"],"realtime":["Real vaqt va xabarlar","sozlama"],"merge":["Tovar birlashtirish","sozlama"],"manualxls":["Amallar (Excel)","sozlama"],"docsfolder":["Hujjatlar papkasi","sozlama"]},"profiles":{"savdo":"Savdo","ishlab_chiqarish":"Ishlab chiqarish","qurilish":"Qurilish","xizmat":"Xizmat ko‘rsatish","ovqatlanish":"Umumiy ovqatlanish"},"poll":[0,2,5,10,15,30],"interval":[0,1,3,6,12,24],"digest":[null,"08:00","09:00","12:00","18:00","20:00"],"msgMax":3500};
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = Boolean(tg && tg.platform && tg.platform !== 'unknown');
  var D = null; // bot yuborgan holat surati
  var Q = [];   // o'zgarishlar navbati: { key, a: [...amal], label }
  var tab = 'home';
  var peopleView = 'users';
  var firmFilter = '';
  var peopleFilter = '';
  var $ = function (id) { return document.getElementById(id); };

  // ───────── yordamchilar ─────────
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { n = Math.round(Number(n) || 0); return String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') .replace(/^/, n < 0 ? '−' : ''); }
  function short(n) { n = Number(n) || 0; var a = Math.abs(n); if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.0', '') + ' mlrd'; if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + ' mln'; if (a >= 1e3) return Math.round(n / 1e3) + ' ming'; return String(Math.round(n)); }
  function dt(iso) { if (!iso) return '—'; var d = new Date(iso); if (isNaN(d)) return '—'; var p = function (x) { return (x < 10 ? '0' : '') + x; }; return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function ago(iso) {
    if (!iso) return 'hech qachon';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return '—';
    if (s < 90) return 'hozirgina';
    if (s < 3600) return Math.round(s / 60) + ' daqiqa oldin';
    if (s < 86400) return Math.round(s / 3600) + ' soat oldin';
    if (s < 86400 * 30) return Math.round(s / 86400) + ' kun oldin';
    return dt(iso).slice(0, 10);
  }
  var COLORS = ['#E17076', '#FAA774', '#A695E7', '#7BC862', '#6EC9CB', '#65AADD', '#EE7AAE'];
  function ava(name, id) { var c = COLORS[Math.abs(Number(String(id).slice(-6)) || 0) % COLORS.length]; var ch = (String(name || '?').trim()[0] || '?').toUpperCase(); return '<div class="ava" style="background:' + c + '">' + esc(ch) + '</div>'; }
  function haptic(kind) { try { if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success'); else if (kind === 'err') tg.HapticFeedback.notificationOccurred('error'); else tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  var toastTimer;
  function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2200); }
  function firmName(tin) { var f = (D.firms || []).find(function (x) { return x.t === tin; }); return f ? f.n || f.t : tin; }
  function roleLabel(r) { return (S.roles && S.roles[r]) || r; }
  function userName(u) { return u.n || u.id; }

  // ───────── holat suratini o'qish ─────────
  function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var bin = atob(s); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function load() {
    var m = /[#&?]d=([A-Za-z0-9_-]+)/.exec(window.__HREF || location.href);
    if (!m) return Promise.reject(new Error('nodata'));
    if (!window.DecompressionStream) return Promise.reject(new Error('old'));
    var stream = new Blob([b64(m[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text().then(JSON.parse);
  }

  // ───────── navbat ─────────
  // `key` bir xil bo'lsa eski o'zgarish almashtiriladi (masalan sozlamani ikki marta bosish)
  function queue(key, action, label) {
    Q = Q.filter(function (x) { return x.key !== key; });
    if (action) Q.push({ key: key, a: action, label: label });
    haptic();
    renderQueue();
  }
  function queued(key) { return Q.find(function (x) { return x.key === key; }); }
  function unqueue(key) { Q = Q.filter(function (x) { return x.key !== key; }); renderQueue(); render(); }
  var qOpen = false;
  function payload() { return JSON.stringify({ t: 'admin', v: S.v, at: D && D.at, a: Q.map(function (x) { return x.a; }) }); }
  function renderQueue() {
    var box = $('queue');
    box.classList.toggle('show', Q.length > 0);
    box.classList.toggle('web', !inTg);
    $('qtitle').textContent = '📝 O‘zgarishlar · ' + Q.length;
    $('qchev').textContent = qOpen ? '▼' : '▲';
    var ul = $('qlist');
    ul.hidden = !qOpen;
    ul.innerHTML = Q.map(function (x) { return '<li><span>' + esc(x.label) + '</span><button data-unq="' + esc(x.key) + '" aria-label="Olib tashlash">✕</button></li>'; }).join('');
    if (inTg) {
      if (Q.length) {
        tg.MainButton.setParams({ text: '💾 Saqlash · ' + Q.length, is_visible: true, is_active: true });
        try { tg.enableClosingConfirmation(); } catch (e) {}
      } else {
        tg.MainButton.hide();
        try { tg.disableClosingConfirmation(); } catch (e) {}
      }
    }
    document.querySelector('main').style.paddingBottom = Q.length ? (qOpen ? '45vh' : '90px') : '';
  }
  function save() {
    if (!Q.length) return;
    var data = payload();
    if (new TextEncoder().encode(data).length > 4096) { haptic('err'); return toast('Juda ko‘p o‘zgarish — bir qismini olib tashlang (xabarlar uzun)'); }
    if (!inTg) return toast('Saqlash — faqat Telegram ichida (botdagi «👑 Admin panel» tugmasi)');
    haptic('ok');
    tg.sendData(data); // Telegram oynani yopadi, bot natijani yozadi
  }

  // ───────── bo'limlar ─────────
  var TABS = [
    ['home', '📊 Umumiy'],
    ['firms', '🏢 Tashkilotlar'],
    ['people', '👥 Odamlar'],
    ['msg', '📣 Xabar'],
    ['set', '⚙️ Sozlamalar'],
  ];
  function issuesOf(f) {
    var out = [];
    if (f.lw) out.push(['red', '🔐 Didox’ga kirish kerak']);
    if (f.se) out.push(['red', '❗ ' + f.se]);
    if (f.ng) out.push(['red', '🔴 Manfiy: ' + f.ng]);
    if (f.un) out.push(['warn', '❓ Tekshirilmagan minus: ' + f.un]);
    if (f.oe) out.push(['red', '⚠️ Boshqa xato: ' + f.oe]);
    if (f.pd) out.push(['warn', '✍️ Imzo kutmoqda: ' + f.pd]);
    if (f.ni) out.push(['gray', '🧩 Birlashtirish: ' + f.ni]);
    return out;
  }
  function renderTabs() {
    var bad = (D.firms || []).filter(function (f) { return !f.fz && issuesOf(f).some(function (x) { return x[0] === 'red'; }); }).length;
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button data-tab="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[1] + (t[0] === 'firms' && bad ? '<i>' + bad + '</i>' : '') + '</button>';
    }).join('');
  }
  function render() {
    renderTabs();
    var html = { home: viewHome, firms: viewFirms, people: viewPeople, msg: viewMsg, set: viewSet }[tab]();
    $('view').innerHTML = html;
  }

  function viewHome() {
    var firms = D.firms || [], users = D.users || [], u = D.use || {};
    var active = firms.filter(function (f) { return !f.fz; });
    var stock = active.reduce(function (n, f) { return n + (Number(f.s) || 0); }, 0);
    var attention = active.filter(function (f) { return issuesOf(f).some(function (x) { return x[0] === 'red'; }); });
    var lic = D.lic || {}, sys = D.sys || {};
    var licBadge = { ok: 'ok', expiring: 'warn', grace: 'warn', expired: 'red' }[lic.st] || 'gray';
    var licText = { ok: 'faol', expiring: (lic.left || 0) + ' kun qoldi', grace: 'tugadi (imtiyoz)', expired: 'tugagan' }[lic.st] || lic.st || '—';
    var h = '';
    h += '<div class="grid">';
    h += kpi(firms.length, 'Tashkilot' + (firms.length - active.length ? ' · ❄️ ' + (firms.length - active.length) : ''));
    h += kpi(users.length, 'Foydalanuvchi' + (users.filter(function (x) { return x.b; }).length ? ' · ⛔ ' + users.filter(function (x) { return x.b; }).length : ''));
    h += kpi(short(stock), 'Ombor jami, so‘m');
    h += kpi(attention.length, 'Diqqat talab qiladi', attention.length > 0);
    h += kpi((u.active && u.active.week) || 0, 'Faol · 7 kunda');
    h += kpi((u.guests && u.guests.month) || 0, 'Yangi qiziqqanlar · 30 kun');
    h += '</div>';
    if (attention.length) {
      h += '<div class="card"><h2>Diqqat</h2>';

    if (a('data-guest')) return guestSheet(a('data-guest'));
    if (a('data-invite')) { inv = { role: 'user' }; return inviteSheet(); }
    if (a('data-irole')) { inv.role = a('data-irole'); return inviteSheet(); }
    if (a('data-icreate')) {
      var n = Q.filter(function (x) { return x.a[0] === 'inv'; }).length + 1;
      if (inv.role === 'client') { var ct = $('iclient').value; queue('inv:' + n, ['inv', 'client', ct], '🔗 Taklif: firma egasi — ' + firmName(ct)); }
      else {
        var fs = readFirmChecks();
        if (fs && !fs.length) { haptic('err'); return toast('Kamida bitta tashkilotni belgilang'); }
        queue('inv:' + n, ['inv', 'user', fs], '🔗 Taklif: buxgalter — ' + (fs ? fs.map(firmName).join(', ') : 'hamma tashkilot'));
      }
      closeSheet(); return render();
    }
    if (a('data-bc')) { bcTo = a('data-bc'); bcText = $('bctext').value; return render(); }
    if (a('data-bcsend')) {
      var text = $('bctext').value.trim();
      if (!text) { haptic('err'); return toast('Xabar matnini yozing'); }
      var k = 'bc:' + Date.now();
      queue(k, ['bc', bcTo, text], '📣 ' + { all: 'Hammaga', user: 'Buxgalterlarga', client: 'Firma egalariga' }[bcTo] + ': «' + text.slice(0, 40) + (text.length > 40 ? '…' : '') + '»');
      bcText = ''; toast('Navbatga qo‘shildi — pastda 💾 Saqlash'); return render();
    }
    if (a('data-set')) {
      var sk = a('data-set'), v = JSON.parse(a('data-v'));
      if (D.set[sk] === v) queue('set:' + sk, null); else queue('set:' + sk, ['set', sk, v], '⚙️ ' + setLabel(sk, v));
      return render();
    }
    if (a('data-demosave')) {
      var dv = $('demobot').value.trim();
      if (dv && !/^(?:https?:\/\/)?(?:t(?:elegram)?\.me\/)?@?[A-Za-z][A-Za-z0-9_]{3,31}\/?$/.test(dv)) { haptic('err'); return toast('Masalan: @material_demo_bot'); }
      if ((D.set.demoBot || '') === dv) queue('set:demoBot', null); else queue('set:demoBot', ['set', 'demoBot', dv], '🧪 Demo bot: ' + (dv || 'o‘chirildi'));
      return render();
    }
    if (a('data-urole')) {
      editing.role = a('data-urole');
      document.querySelectorAll('[data-urole]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-urole') === editing.role); });
      $('ruser').hidden = editing.role !== 'user'; $('rclient').hidden = editing.role !== 'client';
      return haptic();
    }
    if (a('data-uapply')) {
      var uid = a('data-uapply'), u = D.users.find(function (x) { return String(x.id) === uid; });
      queue('role:' + uid, null); queue('firms:' + uid, null);
      if (editing.role === 'client') {
        var tinC = $('uclient').value;
        if (!(u.r === 'client' && u.ft === tinC)) queue('role:' + uid, ['role', uid, 'client', tinC], '🏢 ' + userName(u) + ' → firma egasi: ' + firmName(tinC));
      } else {
        var list = readFirmChecks();
        if (list && !list.length) { haptic('err'); return toast('Kamida bitta tashkilotni belgilang'); }
        if (u.r !== 'user') queue('role:' + uid, ['role', uid, 'user'], '👤 ' + userName(u) + ' → buxgalter');
        var same = u.r === 'user' && JSON.stringify(u.fs ? u.fs.slice().sort() : null) === JSON.stringify(list ? list.slice().sort() : null);
        if (!same) queue('firms:' + uid, ['firms', uid, list], '🏢 ' + userName(u) + ' ko‘radi: ' + (list ? list.map(firmName).join(', ') : 'hamma tashkilot'));
      }
      closeSheet(); toast('Navbatga qo‘shildi'); return render();
    }
    if (a('data-umsg')) {
      var mid = a('data-umsg'), mt = $('umsg').value.trim();
      if (!mt) { haptic('err'); return toast('Xabar matnini yozing'); }
      var who = (D.users || []).concat(D.guests || []).find(function (x) { return String(x.id) === mid; }) || { id: mid };
      queue('msg:' + mid + ':' + Date.now(), ['msg', mid, mt], '✉️ ' + (who.n || mid) + ': «' + mt.slice(0, 40) + (mt.length > 40 ? '…' : '') + '»');
      closeSheet(); toast('Navbatga qo‘shildi — pastda 💾 Saqlash'); return render();
    }
    if (a('data-block')) {
      var bid = a('data-block'), bon = a('data-on') === '1', bu = D.users.find(function (x) { return String(x.id) === bid; });
      if (Boolean(bu.b) === bon) queue('block:' + bid, null); else queue('block:' + bid, ['block', bid, bon], (bon ? '⛔ To‘xtatish: ' : '✅ Qayta ochish: ') + userName(bu));
      closeSheet(); return render();
    }
    if (a('data-del')) {
      var did = a('data-del'), du = D.users.find(function (x) { return String(x.id) === did; });
      var go = function (ok) { if (!ok) return; queue('del:' + did, ['del', did], '🗑 O‘chirish: ' + userName(du)); closeSheet(); render(); };
      if (inTg && tg.showConfirm) tg.showConfirm(userName(du) + ' botdan o‘chirilsinmi?', go); else go(window.confirm(userName(du) + ' botdan o‘chirilsinmi?'));
      return;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fsall') { $('fslist').hidden = t.checked; return haptic(); }
    if (t.hasAttribute('data-sw')) {
      var k = t.getAttribute('data-sw'), v = t.checked;
      if ((D.set[k] !== false) === v) queue('set:' + k, null); else queue('set:' + k, ['set', k, v], '⚙️ ' + setLabel(k, v));
      return;
    }
    if (t.hasAttribute('data-btn')) {
      var bk = t.getAttribute('data-btn'), on = t.checked;
      if ((D.off.indexOf(bk) < 0) === on) queue('btn:' + bk, null); else queue('btn:' + bk, ['btn', bk, on], '🔘 ' + S.toggles[bk][0] + ': ' + (on ? 'ko‘rinadi' : 'yashirin'));
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'ffilter') { firmFilter = e.target.value; var pos = e.target.selectionStart; render(); var el = $('ffilter'); el.focus(); el.setSelectionRange(pos, pos); }
    if (e.target.id === 'pfilter') { peopleFilter = e.target.value; var p2 = e.target.selectionStart; render(); var el2 = $('pfilter'); el2.focus(); el2.setSelectionRange(p2, p2); }
    if (e.target.id === 'bctext') { bcText = e.target.value; $('bccount').textContent = bcText.length + ' / ' + S.msgMax; }
  });
  function setLabel(k, v) {
    var names = { pollMinutes: 'Tezkor tekshirish', syncIntervalHours: 'To‘liq yangilash', digestTime: 'Kunlik xabar', notifyDocs: 'Yangi hujjat xabari', notifyErrors: 'Xato xabarlari', sheetsEnabled: 'Google Sheets' };
    var val = typeof v === 'boolean' ? (v ? 'yoqiladi' : 'o‘chiriladi') : v == null || v === 0 ? 'o‘chiq' : k === 'pollMinutes' ? v + ' daqiqa' : k === 'syncIntervalHours' ? v + ' soat' : v;
    return (names[k] || k) + ': ' + val;
  }
  $('qhead').addEventListener('click', function () { qOpen = !qOpen; renderQueue(); });
  $('qsave').addEventListener('click', save);
  $('sheetbg').addEventListener('click', closeSheet);

  // ───────── ishga tushish ─────────
  if (inTg) {
    document.documentElement.classList.add('tg');
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
    tg.MainButton.onClick(save);
    try { tg.BackButton.onClick(closeSheet); } catch (e) {}
  }
  load().then(function (data) {
    if (!data || data.v !== S.v) throw new Error('version');
    D = data;
    D.set = D.set || {}; D.off = D.off || []; D.firms = D.firms || []; D.users = D.users || []; D.guests = D.guests || [];
    $('sub').textContent = (D.bot && D.bot.u ? '@' + D.bot.u + ' · ' : '') + 'holat ' + dt(D.at);
    render();
    renderQueue();
  }).catch(function (e) {
    var why = { nodata: 'Panel ma’lumotsiz ochildi. Botda /start → «👑 Admin panel» tugmasini bosing.', old: 'Telegram ilovangiz eski — yangilang.', version: 'Panel yangilangan. Botda /start bosib, panelni qayta oching.' }[e && e.message] || 'Ma’lumotni o‘qib bo‘lmadi. Botda /start bosib, panelni qayta oching.';
    $('view').innerHTML = '<div class="card empty">🔒 ' + esc(why) + '</div>';
  });
})();
</script>
</body>
</html>
