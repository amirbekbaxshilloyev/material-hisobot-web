<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boshqaruv paneli — Material Hisobot</title>
<meta name="robots" content="noindex">
<script>
  // Telegram o'z parametrlarini havolaga qo'shadi — bizning `d=` qismini skriptdan OLDIN o'qib olamiz
  window.__HREF = String(location.href);
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #F2F3F7);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #FFFFFF));
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #8A94A6);
    --head: var(--tg-theme-section-header-text-color, #2B6CD8);
    --accent: var(--tg-theme-button-color, #2B6CD8);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --danger: var(--tg-theme-destructive-text-color, #E5484D);
    --ok: #20A464;
    --warn: #E08A1E;
    --line: color-mix(in srgb, var(--hint) 20%, transparent);
    --soft: color-mix(in srgb, var(--accent) 11%, transparent);
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) { --bg: #0E1621; --card: #17212B; --text: #F5F5F5; --hint: #7D8B99; --head: #6AB2F2; --accent: #5288C1; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  main { max-width: 720px; margin: 0 auto; padding: 0 14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); }

  /* Sarlavha */
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 2px 12px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #3B8BFF, #1D5FD6 55%, #0D3A8C); box-shadow: 0 4px 12px rgba(29, 95, 214, .3); }
  .logo svg { width: 26px; height: 26px; }
  .top h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -.01em; }
  .top p { margin: 2px 0 0; color: var(--hint); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .top .refresh { margin-left: auto; border: 0; background: var(--card); color: var(--accent); width: 40px; height: 40px; border-radius: 12px; display: none; place-items: center; box-shadow: var(--shadow); }
  .top .refresh svg { width: 20px; height: 20px; }
  .live .top .refresh { display: grid; }
  .top .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); display: none; }
  .live .livedot { display: inline-block; }
  .busy { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .18); display: none; place-items: center; }
  .busy.on { display: grid; }
  .busy div { background: var(--card); border-radius: 16px; padding: 18px 22px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); font-weight: 600; }
  .busy svg { width: 22px; height: 22px; color: var(--accent); animation: spin .8s linear infinite; }
  .linkbox { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; user-select: all; }
  .page-title { margin: 6px 2px 12px; font-size: 24px; font-weight: 750; letter-spacing: -.02em; }

  /* Kartochkalar */
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card > h2, .sec-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); font-weight: 650; }
  .sec-title { margin: 18px 4px 8px; }
  .card > h2 .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; }
  .hint { color: var(--hint); font-size: 13px; margin: 6px 4px 12px; line-height: 1.45; }

  /* Holat banneri */
  .banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .banner .ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 auto; }
  .banner b { display: block; font-size: 15px; }
  .banner span { font-size: 13px; color: var(--hint); }
  .banner.ok { background: color-mix(in srgb, var(--ok) 10%, var(--card)); }
  .banner.ok .ico { background: var(--ok); color: #fff; }
  .banner.bad { background: color-mix(in srgb, var(--danger) 9%, var(--card)); }
  .banner.bad .ico { background: var(--danger); color: #fff; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 11%, var(--card)); }
  .banner.warn .ico { background: var(--warn); color: #fff; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; border: 0; text-align: left; }
  .kpi .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .kpi .ico svg { width: 18px; height: 18px; }
  .kpi b { font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi span { color: var(--hint); font-size: 12.5px; line-height: 1.3; }
  .c-blue { background: #E8F0FE; color: #1D5FD6; }
  .c-green { background: #E3F6EC; color: #168A52; }
  .c-orange { background: #FDF0E1; color: #C76A0A; }
  .c-red { background: #FDE8E8; color: #C9302C; }
  .c-violet { background: #EFEAFE; color: #6A4BD1; }
  .c-gray { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--hint); }
  .tg-dark .c-blue { background: rgba(82, 136, 193, .18); color: #7FB2F0; }
  .tg-dark .c-green { background: rgba(32, 164, 100, .18); color: #4CC88A; }
  .tg-dark .c-orange { background: rgba(224, 138, 30, .18); color: #F0A954; }
  .tg-dark .c-red { background: rgba(229, 72, 77, .18); color: #F2787C; }
  .tg-dark .c-violet { background: rgba(140, 110, 230, .2); color: #B4A0F5; }

  /* Ro'yxat qatorlari */
  .list { margin: 0 -16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; width: 100%; background: none; border: 0; text-align: left; }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--line); }
  .row.flat + .row.flat::before { left: 16px; }
  .row:active { background: color-mix(in srgb, var(--hint) 8%, transparent); }
  .row .grow { flex: 1; min-width: 0; }
  .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t2 { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .chev { color: var(--hint); opacity: .7; }
  .ava { flex: 0 0 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
  .sq { flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 750; font-size: 16px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
  .kv:first-of-type { border-top: 0; padding-top: 2px; }
  .kv span { color: var(--hint); }
  .kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .kv a { color: var(--accent); text-decoration: none; font-weight: 600; }

  /* Belgilar */
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .p-ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .p-bad { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
  .p-warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .p-gray { background: color-mix(in srgb, var(--hint) 15%, transparent); color: var(--hint); }
  .p-blue { background: var(--soft); color: var(--head); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .d-ok { background: var(--ok); } .d-bad { background: var(--danger); } .d-warn { background: var(--warn); } .d-gray { background: var(--hint); opacity: .5; }

  /* Grafiklar */
  .bars .b { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 7px 0; }
  .bars .b .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars .b .val { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .bars .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--hint) 14%, transparent); overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3B8BFF, #1D5FD6); }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 70px; padding-top: 6px; }
  .spark i { flex: 1; border-radius: 4px 4px 2px 2px; background: color-mix(in srgb, var(--accent) 75%, transparent); min-height: 3px; }
  .spark i.zero { background: color-mix(in srgb, var(--hint) 22%, transparent); }
  .spark-x { display: flex; justify-content: space-between; color: var(--hint); font-size: 11.5px; margin-top: 6px; }

  /* Tugmalar */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 11px 14px; background: var(--soft); color: var(--head); font-weight: 650; flex: 1 1 auto; font-size: 14.5px; }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.danger { background: color-mix(in srgb, var(--danger) 11%, transparent); color: var(--danger); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  .btn:disabled { opacity: .45; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .quick button { border: 0; background: var(--card); border-radius: 16px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); }
  .quick .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }

  /* Boshqaruv elementlari */
  .seg { display: flex; background: color-mix(in srgb, var(--hint) 13%, transparent); border-radius: 11px; padding: 3px; gap: 2px; margin: 0 0 12px; }
  .seg button { flex: 1; border: 0; border-radius: 9px; padding: 7px 4px; background: transparent; font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button.on { background: var(--card); font-weight: 650; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; background: var(--card); font-size: 13.5px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 650; }
  .field { padding: 12px 0; border-top: 1px solid var(--line); }
  .field:first-of-type { border-top: 0; padding-top: 2px; }
  .field .lbl { font-weight: 600; margin-bottom: 2px; }
  .field .sub { color: var(--hint); font-size: 13px; margin-bottom: 10px; }
  label.sw { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  label.sw:first-child { border-top: 0; padding-top: 2px; }
  label.sw .grow { flex: 1; }
  label.sw small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 1px; }
  .switch { position: relative; flex: 0 0 46px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: color-mix(in srgb, var(--hint) 38%, transparent); transition: .18s; }
  .switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .18s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .switch input:checked + i { background: var(--ok); }
  .switch input:checked + i::after { left: 21px; }
  input[type=text], input[type=search], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--bg); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
  .search { position: relative; margin-bottom: 12px; }
  .search input { padding-left: 38px; background: var(--card); box-shadow: var(--shadow); border-color: transparent; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--hint); width: 18px; height: 18px; }
  .count { text-align: right; font-size: 12px; color: var(--hint); margin-top: 4px; }
  .empty { text-align: center; color: var(--hint); padding: 26px 12px; }
  .empty svg { width: 34px; height: 34px; opacity: .5; margin-bottom: 6px; }
  details.grp { border-top: 1px solid var(--line); }
  details.grp:first-of-type { border-top: 0; }
  details.grp summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 0; font-weight: 600; }
  details.grp summary::-webkit-details-marker { display: none; }
  details.grp summary .chev { margin-left: auto; transition: transform .15s; }
  details.grp[open] summary .chev { transform: rotate(90deg); }
  details.grp label.sw { padding-left: 4px; }

  /* Telegram xabari ko'rinishi */
  .bubble { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble b { display: block; margin-bottom: 6px; }

  /* Pastki navigatsiya */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabbar button { flex: 1; border: 0; background: none; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--hint); position: relative; }
  nav.tabbar button svg { width: 23px; height: 23px; }
  nav.tabbar button.on { color: var(--accent); }
  nav.tabbar button em { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10.5px; font-style: normal; display: grid; place-items: center; }

  /* Saqlanmagan o'zgarishlar */
  .pending { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); z-index: 6; display: none; align-items: center; gap: 10px; background: #1F2937; color: #fff; border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); font-size: 14px; white-space: nowrap; max-width: calc(100% - 28px); }
  .pending.show { display: flex; }
  .pending .dot { background: #F5A524; }
  .pending button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 650; font-size: 13.5px; }
  .pending .see { background: rgba(255, 255, 255, .14); color: #fff; }
  .pending .save { background: var(--accent); color: var(--accent-text); }

  /* Pastdan chiqadigan oyna */
  .sheet-bg { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 14px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; max-width: 720px; margin: 0 auto; }
  .sheet.open { transform: none; visibility: visible; transition: transform .22s ease; }
  .sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin: 0 2px 14px; }
  .sheet-head h3 { margin: 0; font-size: 19px; line-height: 1.2; }
  .sheet-head p { margin: 2px 0 0; color: var(--hint); font-size: 13px; }
  .sheet-head .x { margin-left: auto; border: 0; background: color-mix(in srgb, var(--hint) 16%, transparent); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--hint); flex: 0 0 auto; }
  .sheet-head .x svg { width: 16px; height: 16px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stats div { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--hint); font-size: 12px; }
  .issue { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .issue:first-child { border-top: 0; padding-top: 0; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 20; background: rgba(17, 24, 39, .92); color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 14px; display: none; max-width: 90vw; text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .2); }
  .seg.tight button { font-size: 12.5px; padding: 7px 2px; }
  .spinner { width: 28px !important; height: 28px !important; color: var(--accent); opacity: 1 !important; animation: spin .8s linear infinite; }
  .logline { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .fatal { margin-top: 40px; }
  .fatal .card { text-align: center; padding: 28px 20px; }
  .fatal svg { width: 40px; height: 40px; color: var(--hint); }

  /* ═════ Harakat va bezak (2026-10-13, foydalanuvchi: «animatsion va professional ko'rinishda») ═════ */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --sheet-ease: cubic-bezier(.32, .72, 0, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes growx { from { transform: scaleX(0); } }
  @keyframes growy { from { transform: scaleY(0); } }
  @keyframes pop { 0% { transform: scale(.55); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(32, 164, 100, .55); } 70% { box-shadow: 0 0 0 7px rgba(32, 164, 100, 0); } 100% { box-shadow: 0 0 0 0 rgba(32, 164, 100, 0); } }
  @keyframes float { 50% { transform: translate(-16px, 12px) scale(1.08); } }
  @keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(260%) skewX(-20deg); } }

  /* Sahifa kirishi: kartochkalar birin-ketin ko'tariladi (faqat bo'lim almashganda — avto-yangilashda emas) */
  #view.anim > * { animation: rise .5s var(--ease) both; }
  #view.anim > *:nth-child(2) { animation-delay: .04s; } #view.anim > *:nth-child(3) { animation-delay: .08s; }
  #view.anim > *:nth-child(4) { animation-delay: .12s; } #view.anim > *:nth-child(5) { animation-delay: .16s; }
  #view.anim > *:nth-child(6) { animation-delay: .2s; } #view.anim > *:nth-child(7) { animation-delay: .24s; }
  #view.anim > *:nth-child(n+8) { animation-delay: .28s; }
  #view.anim .kpis > *, #view.anim .quick > * { animation: pop .45s var(--spring) both; }
  #view.anim .kpis > *:nth-child(2), #view.anim .quick > *:nth-child(2) { animation-delay: .07s; }
  #view.anim .kpis > *:nth-child(3), #view.anim .quick > *:nth-child(3) { animation-delay: .14s; }
  #view.anim .kpis > *:nth-child(4) { animation-delay: .21s; }
  .bars .fill { transform-origin: left center; }
  #view.anim .bars .fill { animation: growx 1s var(--ease) both .25s; }
  .spark i { transform-origin: bottom; }

    h += kv('Versiya', esc((D.bot && D.bot.ver) || '—'));
    h += kv('Ishlayapti', D.bot && D.bot.up != null ? upTime(D.bot.up) : '—');
    h += kv('Obuna', esc(lic.plan || '—') + ' <span class="pill p-' + licState[0] + '">' + licState[1] + '</span>');
    if (lic.until) h += kv('Amal qiladi', day(lic.until) + ' gacha');
    if (lic.firms) h += kv('Tarif chegarasi', (lic.firms > 999 ? 'cheksiz' : lic.firms) + ' tashkilot · ' + (lic.users > 999 ? 'cheksiz' : lic.users) + ' foydalanuvchi');
    h += kv('Oxirgi to‘liq yangilash', sys.full ? dt(sys.full) + (sys.fullErr ? ' <span class="pill p-bad">' + sys.fullErr + ' xato</span>' : '') : 'hali bo‘lmagan');
    h += kv('Tezkor tekshiruv', sys.quick ? ago(sys.quick) : '—');
    h += kv('Zaxira nusxa', sys.bk ? esc(sys.bk) : 'hali olinmagan');
    h += kv('Maxfiylik siyosati', sys.ps ? 'Imzolangan ' + dt(sys.ps, false) : '<span class="pill p-bad">Imzolanmagan</span>');
    if (sys.pp) h += kv('Siyosat matni', '<a href="#" data-open="' + esc(sys.pp) + '">Ochish ›</a>');
    if (S.live) h += '<div class="btns"><button class="btn" data-logsheet="1">' + ic('list') + 'Bot jurnali</button></div>';
    h += '</div>';
    h += '<div class="sec-title">' + ic('clock') + 'Jurnal</div><div class="card">';
    var log = D.log || [];
    h += log.length ? '<div class="list">' + log.map(logRow).join('') + '</div>' : '<div class="hint" style="margin:0">Paneldan qilingan o‘zgarishlar shu yerda qayd etiladi.</div>';
    h += '</div>';
    return h;
  }
  function field(title, sub, chipsHtml) { return '<div class="field"><div class="lbl">' + esc(title) + '</div><div class="sub">' + esc(sub) + '</div><div class="chips">' + chipsHtml + '</div></div>'; }
  function chip(key, v, label) { return '<button data-set="' + key + '" data-v="' + esc(JSON.stringify(v)) + '" class="' + (cur(key) === v ? 'on' : '') + '">' + esc(label) + '</button>'; }
  function sw(key, title, sub) { return '<label class="sw"><span class="grow">' + esc(title) + '<small>' + esc(sub) + '</small></span><span class="switch"><input type="checkbox" data-sw="' + key + '"' + (cur(key) !== false ? ' checked' : '') + '><i></i></span></label>'; }
  function kv(k, v) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + v + '</b></div>'; }
  function upTime(m) { m = Number(m) || 0; if (m < 60) return m + ' daqiqa'; if (m < 1440) return Math.floor(m / 60) + ' soat ' + (m % 60) + ' daqiqa'; return Math.floor(m / 1440) + ' kun ' + Math.floor((m % 1440) / 60) + ' soat'; }
  function setLabel(k, v) {
    var names = { pollMinutes: 'Yangi hujjatlarni tekshirish', syncIntervalHours: 'To‘liq yangilash', digestTime: 'Kunlik xabar', notifyDocs: 'Yangi hujjat xabari', notifyErrors: 'Xato xabarlari', sheetsEnabled: 'Google jadval' };
    var val = typeof v === 'boolean' ? (v ? 'yoqiladi' : 'o‘chiriladi') : v == null || v === 0 ? 'o‘chiq' : k === 'pollMinutes' ? 'har ' + v + ' daqiqa' : k === 'syncIntervalHours' ? 'har ' + v + ' soat' : v;
    return (names[k] || k) + ': ' + val;
  }

  // ───────── oyna ─────────
  function sheetHead(title, sub, icon, color, avatarHtml) {
    return '<div class="sheet-head">' + (avatarHtml || (icon ? '<div class="sq ' + color + '">' + ic(icon) + '</div>' : '')) + '<div style="min-width:0"><h3>' + esc(title) + '</h3>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div><button class="x" data-close="1" aria-label="Yopish">' + ic('x') + '</button></div>';
  }
  function openSheet(html, keepScroll) {
    var body = $('sheetbody');
    var first = !$('sheet').classList.contains('open');
    body.classList.remove('fresh');
    body.innerHTML = html;
    if (first) { void body.offsetWidth; body.classList.add('fresh'); }
    $('sheet').style.minHeight = '';
    if (!keepScroll) $('sheet').scrollTop = 0;
    $('sheet').classList.add('open');
    $('sheetbg').classList.add('open');
    if (inTg) try { tg.BackButton.show(); } catch (e) {}
  }
  function closeSheet() {
    reopen = null;
    openFirm = null;
    $('sheet').classList.remove('open');
    $('sheetbg').classList.remove('open');
    if (inTg) try { tg.BackButton.hide(); } catch (e) {}
  }
  function refresh() { render(); }

  // ───────── bosishlar ─────────
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-share],[data-copy],[data-tab],[data-quick],[data-firm],[data-sync],[data-freeze],[data-ff],[data-pv],[data-rf],[data-people],[data-user],[data-guest],[data-demo],[data-tenant],[data-pay],[data-claim],[data-revoke],[data-unq],[data-submit],[data-clearq],[data-bc],[data-bcsend],[data-set],[data-demosave],[data-urole],[data-uapply],[data-umsg],[data-block],[data-del],[data-irole],[data-icreate],[data-open],[data-close],[data-journal],[data-fsec],[data-doc],[data-ddir],[data-negf],[data-logf],[data-backfirm],[data-logsheet]');
    if (!t) return;
    var a = function (n) { return t.getAttribute(n); };
    if (a('data-close')) return closeSheet();
    if (a('data-share')) {
      var inv1 = lastInvites[Number(a('data-share'))];
      var shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(inv1.link) + '&text=' + encodeURIComponent('Material Hisobot botiga taklif');
      if (inTg && tg.openTelegramLink) tg.openTelegramLink(shareUrl); else window.open(shareUrl, '_blank');
      return;
    }
    if (a('data-copy')) {
      var inv2 = lastInvites[Number(a('data-copy'))];
      (navigator.clipboard ? navigator.clipboard.writeText(inv2.link) : Promise.reject()).then(function () { haptic('ok'); toast('Nusxa olindi'); }, function () { toast('Havolani bosib turib nusxa oling'); });
      return;
    }
    if (a('data-open')) { e.preventDefault(); return openLink(a('data-open')); }
    if (a('data-tab')) { closeSheet(); return go(a('data-tab')); }
    if (a('data-journal')) { go('set'); setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 50); return; }
    if (a('data-people')) { ui.peopleView = a('data-people'); return go('people'); }
    if (a('data-quick')) {
      var qk = a('data-quick');
      if (qk === 'gomsg') return go('msg');
      if (qk === 'invite') { inv = { role: 'user' }; return inviteSheet(); }
      if (qk === 'syncall') return confirmBox('Hamma tashkilot Didox’dan yangilansinmi?' + closes(), function () { submit([['sync', 'all']]); });
    }
    if (a('data-firm')) { ui.fsec = 'over'; ui.docQ = ''; ui.ddir = 'all'; ui.negF = 'all'; return firmSheet(a('data-firm')); }
    if (a('data-fsec')) { if (ui.fsec === a('data-fsec')) return; ui.fsec = a('data-fsec'); ui.secAnim = true; haptic(); return firmSheet(openFirm, true); }
    if (a('data-ddir')) { ui.ddir = a('data-ddir'); haptic(); return firmSheet(openFirm, true); }
    if (a('data-negf')) { ui.negF = a('data-negf'); haptic(); return firmSheet(openFirm, true); }
    if (a('data-doc')) return docSheet(openFirm, a('data-doc'));
    if (a('data-backfirm')) return firmSheet(a('data-backfirm'));
    if (a('data-logsheet')) return logSheet();
    if (a('data-logf')) { ui.logF = a('data-logf'); haptic(); return renderLog(sheetHead('Bot jurnali', 'Xizmatning oxirgi yozuvlari', 'list', 'c-gray')); }
    if (a('data-sync')) { var st = a('data-sync'); return confirmBox(firmName(st) + ' hozir yangilansinmi?' + closes(), function () { submit([['sync', st]]); }); }
    if (a('data-freeze')) {
      var ft = a('data-freeze'), on = a('data-on') === '1', f = firm(ft);
      if (Boolean(f.fz) === on) queue('freeze:' + ft, null); else queue('freeze:' + ft, ['freeze', ft, on], (on ? 'Muzlatish: ' : 'Muzlatishdan chiqarish: ') + firmName(ft));
      firmSheet(ft); return refresh();
    }
    if (a('data-ff')) { ui.firmFilter = a('data-ff'); haptic(); return refresh(); }
    if (a('data-pv')) { ui.peopleView = a('data-pv'); ui.peopleQ = ''; haptic(); return refresh(); }
    if (a('data-rf')) { ui.roleFilter = a('data-rf'); haptic(); return refresh(); }
    if (a('data-user')) return userSheet(a('data-user'));
    if (a('data-guest')) return guestSheet(a('data-guest'));
    if (a('data-demo')) return demoSheet(a('data-demo'));
    if (a('data-tenant')) return tenantSheet(a('data-tenant'));
    if (a('data-pay')) {
      var pt = a('data-pay'), pp = a('data-plan');
      return confirmBox(tnName(pt) + ': to‘lov qabul qilindimi? «' + pp + '» tarifi 30 kunga yoqiladi.' + closes(), function () { submit([['pay', Number(pt), pp]]); });
    }
    if (a('data-claim')) {
      var ci = a('data-claim'), cok = a('data-ok') === '1';
      return confirmBox((cok ? 'Ariza tasdiqlansinmi? Mijoz ma’lumotni ko‘ra boshlaydi.' : 'Ariza rad etilsinmi? Didox paroli o‘chiriladi.') + closes(), function () { submit([['claim', Number(ci), cok ? 'y' : 'n']]); });
    }
    if (a('data-revoke')) {
      var code = a('data-revoke');
      if (queued('revoke:' + code)) queue('revoke:' + code, null); else queue('revoke:' + code, ['revoke', code], 'Taklif havolasini bekor qilish');
      return refresh();
    }
    if (a('data-unq')) { unqueue(a('data-unq')); if (!Q.length) closeSheet(); else pendingSheet(); return refresh(); }
    if (a('data-submit')) return submit();
    if (a('data-clearq')) return confirmBox('Saqlanmagan o‘zgarishlar bekor qilinsinmi?', function () { Q = []; renderPending(); closeSheet(); refresh(); });
    if (a('data-irole')) { inv.role = a('data-irole'); return inviteSheet(); }
    if (a('data-icreate')) {
      var act;
      if (inv.role === 'client') act = ['inv', 'client', $('iclient').value];
      else {
        var fs = readFirmChecks();
        if (fs && !fs.length) { haptic('err'); return toast('Kamida bitta tashkilotni belgilang'); }
        act = ['inv', 'user', fs];
      }
      return submit([act]);
    }
    if (a('data-bc')) { ui.bcTo = a('data-bc'); ui.bcText = $('bctext').value; return refresh(); }
    if (a('data-bcsend')) {
      var text = $('bctext').value.trim(), n = audience()[ui.bcTo];
      if (!text) { haptic('err'); return toast('Xabar matnini yozing'); }
      return confirmBox(n + ' kishiga xabar yuborilsinmi?', function () { submit([['bc', ui.bcTo, text]]); if (S.live) ui.bcText = ''; });
    }
    if (a('data-set')) {
      var sk = a('data-set'), v = JSON.parse(a('data-v'));
      if (D.set[sk] === v) queue('set:' + sk, null); else queue('set:' + sk, ['set', sk, v], setLabel(sk, v));
      return refresh();
    }
    if (a('data-demosave')) {
      var dv = $('demobot').value.trim();
      if (dv && !/^(?:https?:\/\/)?(?:t(?:elegram)?\.me\/)?@?[A-Za-z][A-Za-z0-9_]{3,31}\/?$/.test(dv)) { haptic('err'); return toast('Masalan: @material_demo_bot'); }
      if ((D.set.demoBot || '') === dv) queue('set:demoBot', null); else queue('set:demoBot', ['set', 'demoBot', dv], 'Demo bot: ' + (dv || 'olib tashlanadi'));
      if (!S.live) toast('O‘zgarish qo‘shildi — «Saqlash» bosing'); return refresh();
    }
    if (a('data-urole')) {
      editing.role = a('data-urole');
      document.querySelectorAll('[data-urole]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-urole') === editing.role); });
      $('ruser').hidden = editing.role !== 'user'; $('rclient').hidden = editing.role !== 'client';
      return haptic();
    }
    if (a('data-uapply')) {
      var uid = a('data-uapply'), u = D.users.find(function (x) { return String(x.id) === uid; });
      queue('role:' + uid, null); queue('firms:' + uid, null);
      if (editing.role === 'client') {
        var tinC = $('uclient').value;
        if (!(u.r === 'client' && u.ft === tinC)) queue('role:' + uid, ['role', uid, 'client', tinC], userName(u) + ' → firma egasi (' + firmName(tinC) + ')');
      } else {
        var list = readFirmChecks();
        if (list && !list.length) { haptic('err'); return toast('Kamida bitta tashkilotni belgilang'); }
        if (u.r !== 'user') queue('role:' + uid, ['role', uid, 'user'], userName(u) + ' → buxgalter');
        var same = u.r === 'user' && JSON.stringify(u.fs ? u.fs.slice().sort() : null) === JSON.stringify(list ? list.slice().sort() : null);
        if (!same) queue('firms:' + uid, ['firms', uid, list], userName(u) + ' ko‘radi: ' + (list ? list.map(firmName).join(', ') : 'hamma tashkilot'));
      }
      closeSheet(); if (!S.live) toast(Q.length ? 'O‘zgarish qo‘shildi — «Saqlash» bosing' : 'O‘zgarish yo‘q'); return refresh();
    }
    if (a('data-umsg')) {
      var mid = a('data-umsg'), mt = $('umsg').value.trim();
      if (!mt) { haptic('err'); return toast('Xabar matnini yozing'); }
      return confirmBox(a('data-name') + ' ga xabar yuborilsinmi?', function () { submit([['msg', mid, mt]]); if (S.live) closeSheet(); });
    }
    if (a('data-block')) {
      var bid = a('data-block'), bon = a('data-on') === '1', bu = D.users.find(function (x) { return String(x.id) === bid; });
      var doBlock = function () { if (Boolean(bu.b) === bon) queue('block:' + bid, null); else queue('block:' + bid, ['block', bid, bon], (bon ? 'To‘xtatish: ' : 'Qayta ochish: ') + userName(bu)); closeSheet(); refresh(); };
      return bon ? confirmBox(userName(bu) + ' botdan foydalanishi to‘xtatilsinmi?', doBlock) : doBlock();
    }
    if (a('data-del')) {
      var did = a('data-del'), du = D.users.find(function (x) { return String(x.id) === did; });
      return confirmBox(userName(du) + ' botdan o‘chirilsinmi? Qayta faqat yangi taklif bilan kira oladi.', function () { queue('del:' + did, ['del', did], 'O‘chirish: ' + userName(du)); closeSheet(); refresh(); });
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fsall') { $('fslist').hidden = t.checked; return haptic(); }
    if (t.hasAttribute('data-sw')) {
      var k = t.getAttribute('data-sw'), v = t.checked;
      if ((D.set[k] !== false) === v) queue('set:' + k, null); else queue('set:' + k, ['set', k, v], setLabel(k, v));
      return;
    }
    if (t.hasAttribute('data-btn')) {
      var bk = t.getAttribute('data-btn'), on = t.checked;
      if ((D.off.indexOf(bk) < 0) === on) queue('btn:' + bk, null); else queue('btn:' + bk, ['btn', bk, on], 'Tugma «' + S.toggles[bk][0] + '»: ' + (on ? 'ko‘rsatiladi' : 'yashiriladi'));
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'firmq' || id === 'peopleq') {
      if (id === 'firmq') ui.firmQ = e.target.value; else ui.peopleQ = e.target.value;
      var pos = e.target.selectionStart; render(); var el = $(id); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
    if (id === 'docq') {
      ui.docQ = e.target.value;
      var c = FD[openFirm];
      if (c && $('doclist')) $('doclist').innerHTML = docRows(c.d);
      return;
    }
    if (id === 'bctext') {
      ui.bcText = e.target.value;
      $('bccount').textContent = ui.bcText.length + ' / ' + S.msgMax;
      $('bcprev').innerHTML = '<b>📣 Admin xabari</b>' + (ui.bcText ? esc(ui.bcText) : '<span style="color:var(--hint)">Matn shu yerda ko‘rinadi</span>');
    }
  });
  $('psee').addEventListener('click', pendingSheet);
  $('psave').addEventListener('click', function () { submit(); });
  $('sheetbg').addEventListener('click', closeSheet);
  var topEl = document.querySelector('.top');
  window.addEventListener('scroll', function () { topEl.classList.toggle('scrolled', window.scrollY > 6); }, { passive: true });

  // ───────── ishga tushish ─────────
  if (inTg) {
    document.documentElement.classList.add('tg');
    if (tg.colorScheme === 'dark') document.documentElement.classList.add('tg-dark');
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
    tg.MainButton.onClick(function () { submit(); });
    try { tg.BackButton.onClick(closeSheet); } catch (e) {}
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('tg-dark');
  }
  if (S.live) {
    document.documentElement.classList.add('live');
    $('refresh').addEventListener('click', function () { haptic(); refreshLive(false); });
    // Har 45 soniyada (oyna ko'rinib turganda va ochiq oyna/yozuv bo'lmaganda) yangi holat
    setInterval(function () {
      if (document.hidden || $('sheet').classList.contains('open') || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) return;
      refreshLive(true);
    }, 45000);
  }
  load().then(function (data) {
    if (!data || data.v !== S.v) throw new Error('version');
    setData(data);
    render(true);
    renderPending();
  }).catch(function (e) {
    var why = { nodata: 'Panel ma’lumotsiz ochildi. Botda /start bosing va «👑 Admin panel» tugmasini tanlang.', noinit: 'Panelni bot ichidagi «👑 Admin panel» yoki «Admin» tugmasidan oching.', old: 'Telegram ilovangiz eski — iltimos, yangilang.', version: 'Panel yangilangan. Botda /start bosib, panelni qayta oching.' }[e && e.message] || (S.live ? e.message : 'Ma’lumotni o‘qib bo‘lmadi. Botda /start bosib, panelni qayta oching.');
    $('tabbar').style.display = 'none';
    $('view').innerHTML = '<div class="fatal"><div class="card">' + ic('lock') + '<p>' + esc(why) + '</p></div></div>';
  });
})();
</script>
</body>
</html>
